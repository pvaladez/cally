<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cally: page/focusedDate render loop</title>
  </head>
  <body>
    <h1>Page + focusedDate change in the same tick → infinite render loop</h1>
    <section>
      <p>
        <strong>Warning:</strong> each red button below freezes this tab (100%
        CPU, memory climbs until the tab is killed). Open DevTools first if you
        want to pause and inspect.
      </p>
    </section>

    <section>
      <div id="home">
        <calendar-date id="calendar" focused-date="2026-10-15">
          <calendar-month></calendar-month>
        </calendar-date>
      </div>
      <div id="elsewhere"></div>
    </section>

    <section>
      <p>
        <button id="next-and-focus" class="freezes" type="button">
          1. Click "next" and set focusedDate in the same task
        </button>
      </p>
      <p>
        <button id="move-and-focus" class="freezes" type="button">
          2. Page ahead, then move the element and set focusedDate in the same
          task
        </button>
      </p>
    </section>

    <section>
      <p>
        Either change alone is fine:
        <button id="next-only" type="button">"next" only</button>
        <button id="focus-only" type="button">focusedDate only</button>
        <output id="log"></output>
      </p>
    </section>

    <script type="module" src="./script.js"></script>
  </body>
</html>
